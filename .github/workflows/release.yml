# A v* tag (CalVer vYYYY.MM.N, release candidates vYYYY.MM.N-rcN) builds the
# firmware (firmware.yml) and makes a DRAFT release with the unsigned .swu and
# the other assets. The maintainer then runs board/erosq/swu/sign-release.sh
# <tag> <key> locally, tests the signed .swu on hardware, and publishes.
# CI never publishes and never holds the signing key.
name: release

on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*']

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

  draft:
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # the draft release
      id-token: write   # provenance for the assets firmware.yml did not attest
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in

      - name: Assets
        run: |
          I=$RUNNER_TEMP/in; A=$RUNNER_TEMP/assets; mkdir -p "$A/extra"
          [[ $TAG =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+(-rc[0-9]+)?$ ]] ||
            { echo "::error::tag $TAG: expected vYYYY.MM.N or vYYYY.MM.N-rcN"; exit 1; }
          # swu/ holds the .swu, itb, squashfs, U-Boot, SD zip, sw-description
          # and their SHA256SUMS, all attested by firmware.yml
          cp "$I"/swu/* "$A/"
          (cd "$A" && sha256sum -c --quiet SHA256SUMS)
          cp "$I"/rootfs/legal-info.tar.gz "$I"/rootfs/sources.tar "$I"/rootfs/sbom.cdx.json "$A/extra/"
          cp pins.mk "$A/extra/PINS.txt"
          (cd "$A/extra" && sha256sum -- * > SHA256SUMS-extra && cat SHA256SUMS-extra)
          ls -l "$A" "$A/extra"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/extra/*

      - name: Draft release
        run: |
          A=$RUNNER_TEMP/assets
          pre=; case $TAG in *-rc*) pre=--prerelease ;; esac
          gh release create "$TAG" --draft $pre --verify-tag --title "$TAG" \
            --notes "Unsigned build of $TAG. The signed erosq-$TAG.swu is added after signing and a hardware test." \
            $(find "$A" -type f | sort)
