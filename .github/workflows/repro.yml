# Weekly reproducibility check: rebuild the latest published release tag with
# no caches (firmware.yml, cache: false) and compare every file in its
# SHA256SUMS with the release's (ci/repro-cmp.py: by sha256, a .swu by its
# cpio entries). Any difference fails this run.
name: repro

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # dispatch firmware.yml on the tag and read its run

jobs:
  repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # this branch's ci/repro-cmp.py, not the tag's (older tags lack it)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Rebuild the latest release
        run: |
          tag=$(gh release list --exclude-drafts --exclude-pre-releases -L 1 --json tagName --jq '.[0].tagName // empty')
          [ -n "$tag" ] || { echo "::notice::no published release yet"; exit 0; }
          echo "tag=$tag" >> "$GITHUB_ENV"
          since=$(date -u +%FT%TZ)
          gh workflow run firmware.yml --ref "$tag" -f cache=false
          for _ in $(seq 30); do
            id=$(gh run list -w firmware.yml -e workflow_dispatch -L 5 --json databaseId,createdAt,headBranch \
              --jq "[.[] | select(.headBranch == \"$tag\" and .createdAt >= \"$since\")][0].databaseId // empty")
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::firmware.yml run for $tag did not start"; exit 1; }
          echo "run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id"
          gh run watch "$id" --exit-status --interval 120 > /dev/null
          gh run download "$id" -n swu -D new
          gh release download "$tag" -p SHA256SUMS -D old
          # a .swu is compared by its cpio entries, so fetch the release's copy
          # (releases before SOURCE_DATE_EPOCH have header-only differences)
          awk '$2 ~ /\.swu$/ { print $2 }' old/SHA256SUMS | while read -r f; do
            gh release download "$tag" -p "$f" -D old
          done
          # only the files the release has: the rebuild may add the installer
          # (EROSQ_RELEASE_INSTALLER turned on after this release); a file it
          # lacks still fails
          python3 -I ci/repro-cmp.py old new ||
            { echo "::error::$tag does not reproduce (see above)"; exit 1; }
          echo "$tag reproduces"
