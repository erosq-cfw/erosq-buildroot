[General]
Name = EROS Q
Class = 0x240404
ControllerMode = dual
JustWorksRepairing = always
# Exposes org.bluez.Battery1 (headphone battery %) for A2DP/AVRCP + BAS devices.
Experimental = true
[Policy]
# false: bt_audio_up.sh powers the adapter on explicitly. Auto-enable races the
# manual connect on the deferred-BT boot path.
AutoEnable = false
[LE]
# 15 ms floor (units of 1.25 ms). The kernel (l2cap clamp, erosq) also holds
# peripheral requests to this: an LE pad at 7.5 ms halved LDAC throughput on the
# single-radio CYW43438 and timed its own link out. Raise it if audio still
# breaks up with a pad connected; lower it if pad input feels laggy.
MinConnectionInterval = 12
