# RAM tuning for 32MB + zram swap (S02sysctl applies at boot).
# swappiness default (60) — and the 10 it was tuned to for disks — hoards idle
# anon pages in RAM; with zram, compressing them out early is nearly free and
# leaves room for page cache (FLAC streaming + UI redraw).
vm.swappiness = 100
# No swap readahead batching: zram is RAM-backed, per-page faults are cheapest.
vm.page-cluster = 0
