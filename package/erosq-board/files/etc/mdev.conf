# SD music card: mount + rescan on insert, unmount + rescan on removal.
# '*' runs the command on BOTH add and remove; sd-hotplug reads $ACTION.
mmcblk0.*  root:root 0660 */usr/sbin/sd-hotplug

# wlan0 (re)created, e.g. by a brcmfmac re-probe: re-attach a running udhcpc
# to the new interface (no device node; mdev still runs the command).
SUBSYSTEM=net;wlan0  root:root 0660 @/usr/bin/wifi_dhcp.sh hotplug

# Everything else: leave the node alone. devtmpfs (CONFIG_DEVTMPFS_MOUNT) has
# already created it with the kernel's mode (null/zero/full/random/urandom/
# tty/ptmx 0666, kmsg 0644). Without this line mdev's implicit match-all
# default (root:root 0660) chmods EVERY node during the `mdev -d` coldplug
# scan and on each hotplug add, so non-root processes lose /dev/null. "!" =
# no mknod/chmod/chown/unlink (devtmpfs owns both create and remove).
.*  root:root 0660 !
