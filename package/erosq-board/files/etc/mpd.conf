log_file            "/var/log/mpd.log"
# Scoped to /audio: the card is a shared Rockbox install; letting MPD recurse
# the junk trees (.rockbox etc.) thrashes the 23.6 MB box to death on scan.
music_directory     "/media/sd/audio"
db_file             "/var/lib/mpd/db"
playlist_directory  "/var/lib/mpd/playlists"
pid_file            "/run/mpd.pid"
bind_to_address     "/run/mpd.sock"
mixer_type          "none"

# --- RAM tuning for the 23.6 MB device ---
# MPD 0.24 defaults audio_buffer_size to 8 MiB (code: DEFAULT_BUFFER_SIZE;
# the docs misstate it as 4) and pre-allocates the whole
# music-pipe chunk pool at startup, then decodes ahead to fill it as fast as
# possible at track start. On 23.6 MB that burst exhausts RAM in <2 s and the
# box thrashes to death (choppy audio / SSH banner timeouts). 1 MiB still holds
# ~2.9 s of 44.1 kHz/24-bit stereo — ample to ride out a reclaim hiccup.
audio_buffer_size   "1024"
# No inotify watcher scanning /media/sd (saves the watch + a thread).
auto_update         "no"
metadata_to_use     "artist,album,title,track,genre"

# Persist queue+position+playstate so a kill+restart resumes exactly where it was.
# Extras games (pcsx etc.) must kill mpd to free RAM/DAC; on relaunch this brings
# the music back. State lives on tmpfs /run, NOT persistent /data, on purpose:
#   - no NAND writes (mpd rewrites this on every play state change)
#   - across power-off it is carried by mpd-persist (graceful shutdown copies it
#     to /data) + S05mounts (copies it back at boot, rewritten play->pause so the
#     device powers on silent with Now Playing restored at the same position).
# restore_paused "no" -> resume *playing* when the state says it was playing
# (the Extras relaunch path); the boot copy is already "pause".
state_file          "/run/mpd.state"
restore_paused      "no"

audio_output {
    type    "alsa"
    name    "ES9018K2M"
    device  "hw:0,0"
    # no mixer block -> erosq-ui owns the hardware volume
}

# Bluetooth A2DP via BlueALSA. Disabled until a sink connects; toggle with
# `enableoutput 1` / `disableoutput 1` over /run/mpd.sock (output id 1; 0 = ES9018K2M).
# device "bluealsa" = most-recently-connected A2DP sink (defaults.bluealsa.device in
# /etc/alsa/conf.d/20-bluealsa.conf), so no per-sink MAC config is needed.
# software mixer: the DAC's hardware volume does not apply to the BT path.
audio_output {
    type        "alsa"
    name        "Bluetooth"
    device      "bluealsa"
    mixer_type  "software"
    enabled     "no"
}
